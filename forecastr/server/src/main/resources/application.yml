server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:forecastr;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
